    <script>
      (function () {
        var CONSENT_KEY = 'pz_analytics_consent_v1';
        var MEASUREMENT_ID = 'G-KGLTSPFH64';

        function configureAnalytics() {
          if (window.__gaConfigured || !window.gtag) return;
          window.__gaConfigured = true;
          gtag('js', new Date());
          gtag('config', MEASUREMENT_ID, { anonymize_ip: true });
        }

        function loadAnalytics() {
          window.dataLayer = window.dataLayer || [];
          window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };

          if (window.__gaLoaded) {
            configureAnalytics();
            return;
          }

          window.__gaLoaded = true;

          var existingScript = document.querySelector('script[data-ga-measurement-id="' + MEASUREMENT_ID + '"]');
          if (existingScript) {
            if (window.__gaScriptReady) {
              configureAnalytics();
            } else {
              existingScript.addEventListener('load', function () {
                window.__gaScriptReady = true;
                configureAnalytics();
              }, { once: true });
            }
            return;
          }

          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + MEASUREMENT_ID;
          script.dataset.gaMeasurementId = MEASUREMENT_ID;
          script.onload = function () {
            window.__gaScriptReady = true;
            configureAnalytics();
          };
          script.onerror = function () {
            window.__gaLoaded = false;
            window.__gaConfigured = false;
          };
          document.head.appendChild(script);
        }

        function saveConsent(value) {
          try {
            localStorage.setItem(CONSENT_KEY, value);
          } catch (error) {
            // Ignore storage errors and continue without persistence.
          }
        }

        function readConsent() {
          try {
            return localStorage.getItem(CONSENT_KEY);
          } catch (error) {
            return null;
          }
        }

        function resetAnalyticsPreferences() {
          try {
            localStorage.removeItem(CONSENT_KEY);
          } catch (error) {
            // Ignore storage errors and continue.
          }
          removeBanner();
          createBanner();
        }

        window.resetAnalyticsPreferences = resetAnalyticsPreferences;

        function removeBanner() {
          var banner = document.getElementById('consent-banner');
          if (banner) banner.remove();
        }

        function createBanner() {
          if (document.getElementById('consent-banner')) return;
          var overlay = document.createElement('div');
          overlay.id = 'consent-banner';
          overlay.style.cssText = [
            'position:fixed',
            'left:16px', 'right:16px', 'bottom:16px',
            'z-index:9999',
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'padding:24px',
            'background:transparent',
            'pointer-events:none'
          ].join(';');

          var banner = document.createElement('div');
          banner.setAttribute('role', 'dialog');
          banner.setAttribute('aria-label', 'Analytics preferences');
          banner.setAttribute('aria-live', 'polite');
          banner.setAttribute('aria-labelledby', 'consent-banner-heading');
          banner.setAttribute('aria-describedby', 'consent-banner-description');
          banner.style.cssText = [
            'width:min(100%,620px)', 'pointer-events:auto',
            'padding:16px',
            'border-radius:4px',
            'border:1px solid rgba(15,23,42,0.18)',
            'background:#ffffff',
            'box-shadow:0 6px 24px rgba(18,43,66,0.12)',
            'display:grid',
            'gap:10px',
            'font:500 14px/1.5 Segoe UI, Arial, sans-serif',
            'color:#0f172a'
          ].join(';');

          var heading = document.createElement('div');
          heading.id = 'consent-banner-heading';
          heading.style.cssText = 'font:800 18px/1.2 Segoe UI, Arial, sans-serif;color:#0f172a;';
          heading.textContent = 'Help improve Waterpolo Hub';

          var text = document.createElement('div');
          text.id = 'consent-banner-description';
          text.textContent =
            'Allow privacy-friendly analytics so I can understand visits and improve the website. Google Analytics 4 only loads after you accept.';

          var actions = document.createElement('div');
          actions.style.cssText = 'display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;';

          var reject = document.createElement('button');
          reject.type = 'button';
          reject.textContent = 'Reject analytics';
          reject.style.cssText = 'border:1px solid rgba(15,23,42,0.18);background:#fff;color:#0f172a;border-radius:4px;padding:14px 16px;font:700 13px Segoe UI, Arial,sans-serif;cursor:pointer;';
          reject.onclick = function () {
            window['ga-disable-' + MEASUREMENT_ID] = true;
            saveConsent('denied');
            removeBanner();
          };

          var accept = document.createElement('button');
          accept.type = 'button';
          accept.textContent = 'Accept analytics';
          accept.style.cssText = 'border:1px solid transparent;background:#1f6197;color:#fff;border-radius:4px;padding:14px 16px;font:700 13px Segoe UI, Arial,sans-serif;cursor:pointer;';
          accept.onclick = function () {
            window['ga-disable-' + MEASUREMENT_ID] = false;
            saveConsent('granted');
            loadAnalytics();
            removeBanner();
          };

          actions.appendChild(reject);
          actions.appendChild(accept);
          banner.appendChild(heading);
          banner.appendChild(text);
          banner.appendChild(actions);
          overlay.appendChild(banner);
          document.body.appendChild(overlay);

        }

        var consent = readConsent();
        if (consent === 'granted') {
          loadAnalytics();
        }

        window.addEventListener('DOMContentLoaded', function () {
          if (!readConsent()) createBanner();
        });
      })();
    </script>
